name: Build Marble Kernel

on:
  workflow_dispatch:
    inputs:
      build_none:
        description: "Manager: none (baseline no-root)"
        type: boolean
        default: false
      build_kernelsu:
        description: "Manager: KernelSU (SUSFS unsupported)"
        type: boolean
        default: false
      build_kernelsu_next:
        description: "Manager: KernelSU-Next (SUSFS uses verified pershoot fork)"
        type: boolean
        default: false
      build_sukisu_ultra:
        description: "Manager: SukiSU Ultra"
        type: boolean
        default: false
      build_resukisu:
        description: "Manager: ReSukiSU"
        type: boolean
        default: false
      enable_susfs:
        description: "Feature: enable SUSFS for supported managers"
        type: boolean
        default: false
      susfs_version:
        description: "Feature: SUSFS preset version"
        type: choice
        default: v2.2.0
        options:
          - v2.2.0
          - v2.1.0
          - custom
      susfs_ref:
        description: "Feature: custom SUSFS ref (custom preset only)"
        required: false
        default: ""
      kernel_source:
        description: "Source: kernel tree / ROM family"
        type: choice
        default: melt
        options:
          - melt
          - lineageos
          - evolution-x
          - aosp-pablo
          - pa-gr
      source_ref:
        description: "Source: override ref (empty = preset default)"
        required: false
        default: ""
      build_scope:
        description: "Build: output scope"
        type: choice
        default: image-only
        options:
          - image-only
          - full
      toolchain:
        description: "Build: compiler (auto = source recommendation)"
        type: choice
        default: auto
        options:
          - auto
          - android-r416183b
          - llvm-22.1.8
      lto:
        description: "Build: LTO (thin default; full needs more RAM)"
        type: choice
        default: thin
        options:
          - none
          - thin
          - full
      enable_ccache:
        description: "CI: use ccache"
        type: boolean
        default: true
      create_draft_release:
        description: "Release: create draft after all jobs pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.kernel_source }}-${{ inputs.toolchain }}-${{ inputs.lto }}-${{ inputs.enable_susfs }}-${{ inputs.build_scope }}
  cancel-in-progress: false

jobs:
  setup:
    name: Generate matrix and validate policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate builder policy
        run: |
          # Fast subset before fan-out; full suite remains in preflight.yml.
          for test_script in \
            tests/test-workflow-policy.sh \
            tests/test-lto-policy.sh \
            tests/test-manager-policy.sh \
            tests/test-matrix-generator.sh \
            tests/test-susfs-presets.sh
          do
            env -u SOURCE_REPO -u SOURCE_REF -u MANAGER -u MANAGER_REF -u ENABLE_SUSFS \
              -u SUSFS_VERSION -u SUSFS_KERNEL_BRANCH -u SUSFS_REF -u SUSFS_EXPECTED_VERSION \
              bash "${test_script}"
          done

      - name: Generate build matrix
        id: gen
        env:
          BUILD_NONE: ${{ inputs.build_none }}
          BUILD_KERNELSU: ${{ inputs.build_kernelsu }}
          BUILD_KERNELSU_NEXT: ${{ inputs.build_kernelsu_next }}
          BUILD_SUKISU_ULTRA: ${{ inputs.build_sukisu_ultra }}
          BUILD_RESUKISU: ${{ inputs.build_resukisu }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          matrix="$(bash scripts/generate-build-matrix.sh)"
          echo "Generated matrix: ${matrix}"

  build:
    name: ${{ matrix.label }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-core.yml
    with:
      kernel_source: ${{ inputs.kernel_source }}
      source_ref: ${{ inputs.source_ref }}
      manager: ${{ matrix.manager }}
      manager_ref: ""
      enable_susfs: ${{ fromJSON(matrix.enable_susfs) }}
      susfs_version: ${{ inputs.susfs_version }}
      susfs_kernel_branch: gki-android12-5.10
      susfs_ref: ${{ inputs.susfs_ref }}
      susfs_expected_version: ""
      build_scope: ${{ inputs.build_scope }}
      toolchain: ${{ inputs.toolchain }}
      lto: ${{ inputs.lto }}
      enable_ccache: ${{ inputs.enable_ccache }}
      artifact_label: ${{ matrix.label }}
      run_policy_tests: false
      publish_step_summary: false
      cache_writer: ${{ fromJSON(matrix.cache_writer) }}

  aggregate-summary:
    name: Generate combined matrix summary
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Metadata only: the ZIPs are not needed to write a summary, and skipping
      # them saves a multi-hundred-MB download per matrix entry.
      - name: Download matrix metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: marble-meta-*-r${{ github.run_number }}
          path: matrix-artifacts
          merge-multiple: false

      - name: Generate combined matrix summary
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
          MATRIX_ARTIFACTS_DIR: matrix-artifacts
          MATRIX_SUMMARY: matrix-summary.md
        run: |
          bash scripts/generate-matrix-summary.sh
          cat matrix-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marble-matrix-summary-r${{ github.run_number }}
          path: matrix-summary.md
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create ZIP-only draft release
    needs: [build, aggregate-summary]
    if: ${{ inputs.create_draft_release == true && needs.build.result == 'success' && needs.aggregate-summary.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download matrix flash artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: marble-flash-*-r${{ github.run_number }}
          path: matrix-artifacts
          merge-multiple: false

      - name: Verify artifacts and prepare release
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
          MATRIX_ARTIFACTS_DIR: matrix-artifacts
          MATRIX_SUMMARY: matrix-summary.md
          RELEASE_ASSETS_FILE: release-assets.txt
          SOURCE_RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/prepare-promoted-release.sh

      - name: Create ZIP-only draft release
        env:
          KERNEL_SOURCE: ${{ inputs.kernel_source }}
        run: |
          source_slug="${KERNEL_SOURCE:-melt}"
          source_slug="$(printf '%s' "${source_slug}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          [[ -n "${source_slug}" ]] || source_slug="melt"
          display="${source_slug}"
          if [[ -f config/kernel-sources.json ]]; then
            display="$(KERNEL_SOURCE="${KERNEL_SOURCE}" python3 -c "import json,os; p=json.load(open('config/kernel-sources.json',encoding='utf-8')); print(p.get(os.environ.get('KERNEL_SOURCE',''),{}).get('display') or '')")"
            [[ -n "${display}" ]] || display="${source_slug}"
          fi

          tag="marble-${source_slug}-r${GITHUB_RUN_NUMBER}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi

          mapfile -t release_assets < release-assets.txt
          if [[ "${#release_assets[@]}" -eq 0 ]]; then
            echo "::error::No verified ZIP assets were prepared"
            exit 1
          fi

          # Prefer release notes without CI-only Cache section (written by prepare-promoted-release).
          notes_file="matrix-summary-release.md"
          if [[ ! -f "${notes_file}" ]]; then
            notes_file="matrix-summary.md"
          fi

          gh release create "${tag}" "${release_assets[@]}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Marble Kernel · ${display} · r${GITHUB_RUN_NUMBER}" \
            --notes-file "${notes_file}"
